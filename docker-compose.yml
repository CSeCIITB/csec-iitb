services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CTFD_URL: ${NEXT_PUBLIC_CTFD_URL:-}
    image: csec-iitb:latest
    ports:
      - "3000:3000"
    # Server-side CTFd overrides etc. — see .env.example. Optional.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
